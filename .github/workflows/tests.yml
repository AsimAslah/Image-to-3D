name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-to-3d-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-brickrat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web-Brickrat/requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "numpy<2" \
            omegaconf==2.3.0 \
            Pillow==10.1.0 \
            einops==0.7.0 \
            trimesh==4.0.5 \
            rembg \
            onnxruntime \
            huggingface-hub==0.20.3 \
            "fastapi>=0.115,<1" \
            "jinja2>=3.1,<4" \
            "python-multipart>=0.0.9" \
            "python-dotenv>=1.0,<2" \
            "supabase>=2.10,<3" \
            usd-core==26.5 \
            httpx
      - name: Run tests
        working-directory: web-Brickrat
        run: python -m unittest discover -s tests -v
